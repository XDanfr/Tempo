name: Signed bundle
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build the signed Android App Bundle from'
        type: string
        default: 'v0.5.2'
      attach:
        description: 'Also attach the AAB to that GitHub release'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: tempo-signed-bundle
  cancel-in-progress: false
jobs:
  bundle:
    # Signing credentials are used only when dispatched from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Prepare signing key
        env:
          TEMPO_KEYSTORE_BASE64: ${{ secrets.TEMPO_KEYSTORE_BASE64 }}
          TEMPO_KEYSTORE_PASSWORD: ${{ secrets.TEMPO_KEYSTORE_PASSWORD }}
          TEMPO_KEY_ALIAS: ${{ secrets.TEMPO_KEY_ALIAS }}
          TEMPO_KEY_PASSWORD: ${{ secrets.TEMPO_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          names = ('TEMPO_KEYSTORE_BASE64', 'TEMPO_KEYSTORE_PASSWORD', 'TEMPO_KEY_ALIAS', 'TEMPO_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tempo-release.jks'
          key.write_bytes(base64.b64decode(''.join(os.environ['TEMPO_KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build signed bundle
        env:
          TEMPO_KEYSTORE_PATH: ${{ runner.temp }}/tempo-release.jks
          TEMPO_KEYSTORE_PASSWORD: ${{ secrets.TEMPO_KEYSTORE_PASSWORD }}
          TEMPO_KEY_ALIAS: ${{ secrets.TEMPO_KEY_ALIAS }}
          TEMPO_KEY_PASSWORD: ${{ secrets.TEMPO_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --no-daemon
      - name: Verify signature and name bundle
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose:summary -certs "$aab" | tail -5
          jarsigner -verify "$aab" | grep -q 'jar verified'
          mkdir -p release
          cp "$aab" "release/Tempo-${TAG#v}.aab"
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: tempo-signed-aab
          path: release/*.aab
          if-no-files-found: error
      - name: Attach to GitHub release
        if: inputs.attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" release/*.aab
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tempo-release.jks"
