name: Signed release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the signed APK and update metadata as a stable GitHub release'
        type: boolean
        default: false
      draft:
        description: 'Create a draft GitHub release with the signed APK and update metadata'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: tempo-signed-release
  cancel-in-progress: false
jobs:
  release:
    # Signing credentials are used only with the merged main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release mode
        env:
          PUBLISH: ${{ inputs.publish }}
          DRAFT: ${{ inputs.draft }}
        run: |
          if [[ "$PUBLISH" == "true" && "$DRAFT" == "true" ]]; then
            echo "Choose either draft or published release mode."
            exit 1
          fi
      - name: Prepare signing key
        env:
          TEMPO_KEYSTORE_BASE64: ${{ secrets.TEMPO_KEYSTORE_BASE64 }}
          TEMPO_KEYSTORE_PASSWORD: ${{ secrets.TEMPO_KEYSTORE_PASSWORD }}
          TEMPO_KEY_ALIAS: ${{ secrets.TEMPO_KEY_ALIAS }}
          TEMPO_KEY_PASSWORD: ${{ secrets.TEMPO_KEY_PASSWORD }}
        shell: python
        run: |
          import base64, os, pathlib
          names = ('TEMPO_KEYSTORE_BASE64', 'TEMPO_KEYSTORE_PASSWORD', 'TEMPO_KEY_ALIAS', 'TEMPO_KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tempo-release.jks'
          key.write_bytes(base64.b64decode(''.join(os.environ['TEMPO_KEYSTORE_BASE64'].split()), validate=True))
          key.chmod(0o600)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build signed release
        env:
          TEMPO_KEYSTORE_PATH: ${{ runner.temp }}/tempo-release.jks
          TEMPO_KEYSTORE_PASSWORD: ${{ secrets.TEMPO_KEYSTORE_PASSWORD }}
          TEMPO_KEY_ALIAS: ${{ secrets.TEMPO_KEY_ALIAS }}
          TEMPO_KEY_PASSWORD: ${{ secrets.TEMPO_KEY_PASSWORD }}
        run: ./gradlew :core:schedule:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease --no-daemon
      - name: Verify release identity and signatures
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
          grep -F "package: name='cc.xdan.tempo'" <<< "$badging"
          bundle_signature=$(jarsigner -verify "$aab")
          printf '%s\n' "$bundle_signature"
          grep -F 'jar verified.' <<< "$bundle_signature"
          test -s app/build/outputs/mapping/release/mapping.txt
      - name: Prepare release metadata
        shell: python
        run: |
          import hashlib, json, pathlib, re, shutil
          source = pathlib.Path('app/build.gradle.kts').read_text()
          version = re.search(r'versionName = "([0-9.]+)"', source).group(1)
          code = int(re.search(r'versionCode = ([0-9]+)', source).group(1))
          directory = pathlib.Path('release'); directory.mkdir()
          apk = directory / f'Tempo-{version}.apk'
          shutil.copy('app/build/outputs/apk/release/app-release.apk', apk)
          shutil.copy('app/build/outputs/bundle/release/app-release.aab', directory / f'Tempo-{version}.aab')
          manifest = dict(formatVersion=1, versionCode=code, versionName=version, apk=apk.name, sha256=hashlib.sha256(apk.read_bytes()).hexdigest())
          (directory / 'tempo-update.json').write_text(json.dumps(manifest, indent=2) + '\n')
      - name: Publish stable GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('release/tempo-update.json'))['versionName'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This release already exists. Refusing to replace published update assets.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "Tempo $version" --generate-notes release/*
      - name: Create draft GitHub release
        if: inputs.draft && !inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('release/tempo-update.json'))['versionName'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "A release already exists for $tag. Refusing to replace it."
            exit 1
          fi
          cat > "$RUNNER_TEMP/tempo-release-notes.md" <<EOF
          ## What's new in Tempo $version

          - Compare timetables side by side or combine schedules into one agenda to find shared free time.
          - Add a 2×1, 2×2 or 4×2 home-screen widget with current and upcoming periods, countdowns and completion messages.
          - Match widgets to the app with brighter themes, subject colours, icons, optional outlines and more readable lesson cards.
          - Check for stable updates in Settings or enable automatic daily checks on unmetered connections. Update metadata and the installed signing certificate are verified, and Android asks before installation.
          - Updated the public-facing documentation and added sponsor support in Settings.

          ## Compatibility

          Tempo requires Android 8.0 or newer. Homework and assignment tracking with widget due dates is planned for a future release.
          EOF
          gh release create "$tag" --target "$GITHUB_SHA" --title "Tempo $version" --notes-file "$RUNNER_TEMP/tempo-release-notes.md" --draft release/*
      - name: Upload signed APK, bundle and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-release-${{ github.run_number }}
          if-no-files-found: error
          path: |
            release/
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/tempo-release.jks"
