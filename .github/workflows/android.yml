name: Android
on:
  push:
    branches: [main, feature/widget-2.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test, lint and assemble
        run: ./gradlew --max-workers=1 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process :core:model:test :core:schedule:test :core:data:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleQa :app:assembleDebugAndroidTest :app:lintRelease :app:assembleRelease :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-QA
          if-no-files-found: error
          path: app/build/outputs/apk/qa/*.apk
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-check-reports
          if-no-files-found: ignore
          path: |
            core/model/build/test-results/
            core/schedule/build/test-results/
            core/data/build/test-results/
            app/build/test-results/
            app/build/reports/widget-redesign/
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
            app/build/outputs/mapping/release/

  remote-compose-lab:
    if: github.ref == 'refs/heads/feature/widget-2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test and build isolated renderer lab
        run: ./gradlew --max-workers=1 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process -PtempoRemoteCompose=true :experiments:remote-compose:testDebugUnitTest :experiments:remote-compose:lintDebug :experiments:remote-compose:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Tempo-Remote-Compose-Lab
          if-no-files-found: error
          path: experiments/remote-compose/build/outputs/apk/debug/*.apk
      - name: Upload experimental test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-Lab-check-reports
          if-no-files-found: ignore
          path: |
            experiments/remote-compose/build/test-results/
            experiments/remote-compose/build/reports/lint-results-debug.*
