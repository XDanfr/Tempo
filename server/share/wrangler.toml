# Tempo share service: stores end-to-end encrypted timetable snapshots only.
# Live at https://tempo.xdan.cc (deployed November 2026). Free plan: D1 stops at its limits instead of billing.
name = "tempo-share"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false
routes = [{ pattern = "tempo.xdan.cc", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "tempo-share"
database_id = "d7e62b00-248e-437a-aff8-86505602f646"

[triggers]
crons = ["17 3 * * *"]

[vars]
# SHA-256 fingerprint(s) of the release signing certificate, comma-separated, for Android App Links.
ANDROID_CERT_FINGERPRINTS = "FC:EB:6F:CC:4D:FD:F3:C0:2F:14:06:81:5D:7F:89:69:78:1E:EA:8A:37:AC:11:B7:52:8C:FE:D2:85:F7:69:B1"
# QA builds (cc.xdan.tempo.qa) may use passkeys too; their debug certificate fingerprint(s), comma-separated.
QA_CERT_FINGERPRINTS = "00:7E:17:6C:C2:A0:20:B1:2A:13:19:50:B4:40:EE:89:E9:40:7B:99:76:B2:F4:45:D7:6D:6A:D8:9B:AA:56:AC"
